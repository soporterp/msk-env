services:

  postgres:

    image: postgres:17

    container_name: rpdm-postgres

    hostname: postgres

    restart: unless-stopped

    profiles:
      - core

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}

    volumes:
      - /u01/databases/postgres/data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    shm_size: 1gb

    networks:
      - msk-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10
