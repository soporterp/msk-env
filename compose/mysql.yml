services:

  mysql:

    image: mysql:8.4

    container_name: rpdm-mysql

    hostname: mysql

    restart: unless-stopped

    profiles:
      - core

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - /u01/databases/mysql/data:/var/lib/mysql

    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 10

    networks:
      - msk-net
